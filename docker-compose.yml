services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:?APP_ALLOWED_ORIGINS is required}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      TRPC_MAX_BODY_BYTES: ${TRPC_MAX_BODY_BYTES:-32768}
      TRPC_MAX_URL_BYTES: ${TRPC_MAX_URL_BYTES:-16384}
      TRPC_RATE_LIMIT_MAX: ${TRPC_RATE_LIMIT_MAX:-120}
      TRPC_RATE_LIMIT_WINDOW_MS: ${TRPC_RATE_LIMIT_WINDOW_MS:-60000}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SISTER_BASE_URL: ${SISTER_BASE_URL:?SISTER_BASE_URL is required}
      SISTER_ID_PENGGUNA: ${SISTER_ID_PENGGUNA:?SISTER_ID_PENGGUNA is required}
      SISTER_INTEGRATION_ID: ${SISTER_INTEGRATION_ID:?SISTER_INTEGRATION_ID is required}
      SISTER_USERNAME: ${SISTER_USERNAME:?SISTER_USERNAME is required}
      SISTER_PASSWORD: ${SISTER_PASSWORD:?SISTER_PASSWORD is required}
      SISTER_CREDENTIAL_REF: ${SISTER_CREDENTIAL_REF:-environment}
      SISTER_SDM_CACHE_TTL_SECONDS: ${SISTER_SDM_CACHE_TTL_SECONDS:-300}
      SISTER_FIXTURE_MODE: "false"
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3100}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
